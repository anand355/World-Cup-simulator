<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World Cup Match Simulator</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #0a0a0a;
    color: white;
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 40px;
    background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
    width: 100%;
  }

  header h1 {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FFD700;
    width: 100%;
  }

  header p {
    color: #888;
    margin-top: 8px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .match-setup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin: 60px auto;
    width: 100%;
    max-width: 900px;
  }

  .team-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 32px;
    width: 300px;
  }

  .team-card img {
    width: 100px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #333;
  }

  .team-card select {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }

  .team-card input {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 15px;
    text-align: center;
  }

  .vs-badge {
    font-size: 48px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }

  #predict-btn {
    display: block;
    margin: 0 auto 60px;
    padding: 16px 48px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #000;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.2s;
  }

  #predict-btn:hover {
    transform: scale(1.05);
  }

  #result {
    text-align: center;
    font-size: 80px;
    font-weight: 900;
    color: white;
    margin-bottom: 40px;
  }

  .score-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-bottom: 32px;
  }

  .result-team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 160px;
  }

  .result-team img {
    width: 90px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #333;
  }

  .result-team-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ddd;
  }

  .score-numbers {
    font-size: 64px;
    font-weight: 900;
    color: #FFD700;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .score-numbers .dash {
    color: #555;
    font-size: 40px;
  }

  .win-prob-bar {
    display: flex;
    width: 100%;
    max-width: 600px;
    height: 14px;
    margin: 0 auto 12px;
    border-radius: 8px;
    overflow: hidden;
    background: #1a1a1a;
  }

  .win-prob-segment {
    height: 100%;
    transition: width 0.4s ease;
  }

  .prob-team1 { background: #FFD700; }
  .prob-draw  { background: #555; }
  .prob-team2 { background: #FFA500; }

  .win-prob-labels {
    display: flex;
    justify-content: space-between;
    max-width: 600px;
    margin: 0 auto 40px;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.5px;
  }

  .stats-comparison {
    display: flex;
    justify-content: center;
    gap: 60px;
    max-width: 700px;
    margin: 0 auto;
  }

  .stat-col {
    flex: 1;
    max-width: 260px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #222;
    font-size: 14px;
    color: #ccc;
  }

  .stat-row span:last-child {
    color: #FFD700;
    font-weight: 700;
  }

  .h2h-section {
    max-width: 700px;
    margin: 40px auto 0;
    border-top: 1px solid #222;
    padding-top: 30px;
  }

  .h2h-title {
    text-align: center;
    color: #FFD700;
    font-size: 18px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .h2h-summary {
    text-align: center;
    color: #ccc;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .h2h-match {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #ccc;
  }

  .h2h-match .h2h-score {
    color: #FFD700;
    font-weight: 700;
  }

  .h2h-match .h2h-date {
    color: #666;
    font-size: 12px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

  <header>
    <h1>⚽ World Cup Match Simulator</h1>
    <p>Pick any two teams from any era</p>
  </header>

<main>

  <div class="match-setup">

    <!-- Left team -->
    <div class="team-card">
      <img id="flag1" src="" alt="flag">
      <select id="team1">
        <option value="">Select Team</option>
      </select>
      <input type="number" id="year1" placeholder="Year e.g. 2002" min="1990" max="2026"
      onchange="updateTeams(this.value, 'team1')">
    </div>

    <!-- VS -->
    <div class="vs-badge">VS</div>

    <!-- Right team -->
    <div class="team-card">
      <img id="flag2" src="" alt="flag">
      <select id="team2">
        <option value="">Select Team</option>
      </select>
      <input type="number" id="year2" placeholder="Year e.g. 2022" min="1990" max="2026"
      onchange="updateTeams(this.value, 'team2')">
    </div>

  </div>

  <button id="predict-btn" onclick="predict()">⚡ SIMULATE MATCH</button>

  <div id="result" class="hidden">
    <div class="score-display">
      <div class="result-team">
        <img id="result-flag1" src="" alt="flag">
        <div class="result-team-name" id="result-team1-name"></div>
      </div>
      <div class="score-numbers">
        <span id="score1">0</span>
        <span class="dash">-</span>
        <span id="score2">0</span>
      </div>
      <div class="result-team">
        <img id="result-flag2" src="" alt="flag">
        <div class="result-team-name" id="result-team2-name"></div>
      </div>
    </div>

    <div class="win-prob-bar">
      <div class="win-prob-segment prob-team1" id="prob1-bar"></div>
      <div class="win-prob-segment prob-draw" id="probdraw-bar"></div>
      <div class="win-prob-segment prob-team2" id="prob2-bar"></div>
    </div>
    <div class="win-prob-labels">
      <span id="prob1-label"></span>
      <span id="probdraw-label"></span>
      <span id="prob2-label"></span>
    </div>

    <div class="stats-comparison">
      <div class="stat-col">
        <div class="stat-row"><span>Attack rating</span><span id="stat1-attack"></span></div>
        <div class="stat-row"><span>Defense rating</span><span id="stat1-defense"></span></div>
        <div class="stat-row"><span>Matches played</span><span id="stat1-matches"></span></div>
      </div>
      <div class="stat-col">
        <div class="stat-row"><span>Attack rating</span><span id="stat2-attack"></span></div>
        <div class="stat-row"><span>Defense rating</span><span id="stat2-defense"></span></div>
        <div class="stat-row"><span>Matches played</span><span id="stat2-matches"></span></div>
      </div>
    </div>

    <div class="h2h-section">
      <h3 class="h2h-title">Head-to-Head History</h3>
      <div class="h2h-summary" id="h2h-summary"></div>
      <div class="h2h-matches" id="h2h-matches"></div>
    </div>
  </div>

</main>
<script>
    const flagCodes = {
    'Brazil': 'br', 'Argentina': 'ar', 'France': 'fr',
    'Germany': 'de', 'Spain': 'es', 'England': 'gb-eng',
    'Japan': 'jp', 'Portugal': 'pt', 'Italy': 'it',
    'Netherlands': 'nl', 'Uruguay': 'uy', 'Croatia': 'hr',
    'Belgium': 'be', 'Mexico': 'mx', 'United States': 'us',
    'South Korea': 'kr', 'Senegal': 'sn', 'Morocco': 'ma',
    'Australia': 'au', 'Switzerland': 'ch', 'Poland': 'pl',
    'Denmark': 'dk', 'Sweden': 'se', 'Colombia': 'co',
    'Chile': 'cl', 'Nigeria': 'ng', 'Cameroon': 'cm',
    'Ghana': 'gh', 'Saudi Arabia': 'sa', 'Iran': 'ir',
    'Serbia': 'rs', 'Ecuador': 'ec', 'Qatar': 'qa',
    'Turkey': 'tr', 'Czech Republic': 'cz', 'Hungary': 'hu',
    'Russia': 'ru', 'Ukraine': 'ua', 'Scotland': 'gb-sct',
    'Wales': 'gb-wls', 'Costa Rica': 'cr', 'Peru': 'pe',
    'Paraguay': 'py', 'Canada': 'ca', 'Norway': 'no',
    'Austria': 'at', 'Greece': 'gr', 'Ireland': 'ie',
    'Tunisia': 'tn', 'Egypt': 'eg', 'Algeria': 'dz',
    'South Africa': 'za', 'New Zealand': 'nz', 'China': 'cn'
};

function updateFlag(teamName, flagImgId) {
    const code = flagCodes[teamName];
    const img = document.getElementById(flagImgId);
    if (code) {
        img.src = `https://flagcdn.com/w160/${code}.png`;
    } else {
        img.src = '';
    }
}
document.getElementById('team1').addEventListener('change', function() {
    updateFlag(this.value, 'flag1');
});

document.getElementById('team2').addEventListener('change', function() {
    updateFlag(this.value, 'flag2');
});
    window.onload = async function() {
    // Load all teams initially
    const response = await fetch('/api/teams');
    const teams = await response.json();
    
    const select1 = document.getElementById('team1');
    const select2 = document.getElementById('team2');
    
    teams.forEach(team => {
        const opt1 = document.createElement('option');
        opt1.value = team;
        opt1.textContent = team;
        select1.appendChild(opt1);
        
        const opt2 = document.createElement('option');
        opt2.value = team;
        opt2.textContent = team;
        select2.appendChild(opt2);
    });
};

async function updateTeams(year, selectId) {
    if (!year || year < 1930) return;
    
    const response = await fetch(`/api/wc_teams?year=${year}`);
    const teams = await response.json();
    
    const select = document.getElementById(selectId);
    select.innerHTML = '<option value="">Select Team</option>';
    updateFlag('', selectId === 'team1' ? 'flag1' : 'flag2');

    if (teams.length === 0) {
        select.innerHTML = '<option value="">No World Cup that year</option>';
        return;
    }
    
    teams.forEach(team => {
        const opt = document.createElement('option');
        opt.value = team;
        opt.textContent = team;
        select.appendChild(opt);
    });
}

async function predict() {
    const team1 = document.getElementById('team1').value;
    const year1 = document.getElementById('year1').value;
    const team2 = document.getElementById('team2').value;
    const year2 = document.getElementById('year2').value;

    if (!team1 || !year1 || !team2 || !year2) {
        alert('Please select both teams and years first.');
        return;
    }

    const btn = document.getElementById('predict-btn');
    btn.disabled = true;
    btn.textContent = 'SIMULATING...';

    try {
        const res = await fetch(`/api/predict?team1=${encodeURIComponent(team1)}&year1=${year1}&team2=${encodeURIComponent(team2)}&year2=${year2}`);
        const data = await res.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        renderResult(data);
        fetchHeadToHead(team1, team2);
    } catch (err) {
        alert('Something went wrong. Try again.');
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '⚡ SIMULATE MATCH';
    }
}

function renderResult(data) {
    document.getElementById('result-team1-name').textContent = `${data.team1} '${String(data.year1).slice(2)}`;
    document.getElementById('result-team2-name').textContent = `${data.team2} '${String(data.year2).slice(2)}`;

    const code1 = flagCodes[data.team1];
    const code2 = flagCodes[data.team2];
    document.getElementById('result-flag1').src = code1 ? `https://flagcdn.com/w160/${code1}.png` : '';
    document.getElementById('result-flag2').src = code2 ? `https://flagcdn.com/w160/${code2}.png` : '';

    document.getElementById('score1').textContent = data.score1;
    document.getElementById('score2').textContent = data.score2;

    const p1 = data.win_prob.team1;
    const pd = data.win_prob.draw;
    const p2 = data.win_prob.team2;

    document.getElementById('prob1-bar').style.width = p1 + '%';
    document.getElementById('probdraw-bar').style.width = pd + '%';
    document.getElementById('prob2-bar').style.width = p2 + '%';

    document.getElementById('prob1-label').textContent = `${data.team1} ${p1}%`;
    document.getElementById('probdraw-label').textContent = `Draw ${pd}%`;
    document.getElementById('prob2-label').textContent = `${data.team2} ${p2}%`;

    document.getElementById('stat1-attack').textContent = data.stats1.attack.toFixed(2);
    document.getElementById('stat1-defense').textContent = data.stats1.defense.toFixed(2);
    document.getElementById('stat1-matches').textContent = data.stats1.total_matches;

    document.getElementById('stat2-attack').textContent = data.stats2.attack.toFixed(2);
    document.getElementById('stat2-defense').textContent = data.stats2.defense.toFixed(2);
    document.getElementById('stat2-matches').textContent = data.stats2.total_matches;

    document.getElementById('result').classList.remove('hidden');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function fetchHeadToHead(team1, team2) {
    const summary = document.getElementById('h2h-summary');
    const container = document.getElementById('h2h-matches');
    summary.textContent = 'Loading history...';
    container.innerHTML = '';

    try {
        const res = await fetch(`/api/head_to_head?team1=${encodeURIComponent(team1)}&team2=${encodeURIComponent(team2)}`);
        const data = await res.json();

        if (data.total_matches === 0) {
            summary.textContent = `${team1} and ${team2} have never played each other.`;
            return;
        }

        summary.textContent = `${data.total_matches} meetings — ${team1} ${data.team1_wins}W, ${team2} ${data.team2_wins}W, ${data.draws} draws`;

        data.matches.forEach(m => {
            const row = document.createElement('div');
            row.className = 'h2h-match';
            row.innerHTML = `
                <span>${m.home_team} <span class="h2h-score">${m.home_score} - ${m.away_score}</span> ${m.away_team}</span>
                <span class="h2h-date">${m.tournament} · ${m.date}</span>
            `;
            container.appendChild(row);
        });
    } catch (err) {
        summary.textContent = 'Could not load head-to-head history.';
        console.error(err);
    }
}
  </script>
  </script>
</body>
</html>
