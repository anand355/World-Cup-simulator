<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World Cup Match Simulator</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #0a0a0a;
    color: white;
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 40px;
    background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
    width: 100%;
  }

  header h1 {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FFD700;
    width: 100%;
  }

  header p {
    color: #888;
    margin-top: 8px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .match-setup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin: 60px auto;
    width: 100%;
    max-width: 900px;
  }

  .team-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 32px;
    width: 300px;
  }

  .team-card img {
    width: 100px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #333;
  }

  .team-card select {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }

  .team-card input {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 15px;
    text-align: center;
  }

  .vs-badge {
    font-size: 48px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }

  #predict-btn {
    display: block;
    margin: 0 auto 60px;
    padding: 16px 48px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #000;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.2s;
  }

  #predict-btn:hover {
    transform: scale(1.05);
  }

  #result {
    text-align: center;
    font-size: 80px;
    font-weight: 900;
    color: white;
    margin-bottom: 40px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

  <header>
    <h1>⚽ World Cup Match Simulator</h1>
    <p>Pick any two teams from any era</p>
  </header>

<main>

  <div class="match-setup">

    <!-- Left team -->
    <div class="team-card">
      <img id="flag1" src="" alt="flag">
      <select id="team1">
        <option value="">Select Team</option>
      </select>
      <input type="number" id="year1" placeholder="Year e.g. 2002" min="1930" max="2026"
      onchange="updateTeams(this.value, 'team1')">
    </div>

    <!-- VS -->
    <div class="vs-badge">VS</div>

    <!-- Right team -->
    <div class="team-card">
      <img id="flag2" src="" alt="flag">
      <select id="team2">
        <option value="">Select Team</option>
      </select>
      <input type="number" id="year2" placeholder="Year e.g. 2022" min="1930" max="2026"
      onchange="updateTeams(this.value, 'team2')">
    </div>

  </div>

  <button id="predict-btn" onclick="predict()">⚡ SIMULATE MATCH</button>

  <div id="result" class="hidden">
    <span id="score1">0</span>
    <span> - </span>
    <span id="score2">0</span>
  </div>

</main>
<script>
    window.onload = async function() {
    // Load all teams initially
    const response = await fetch('/api/teams');
    const teams = await response.json();
    
    const select1 = document.getElementById('team1');
    const select2 = document.getElementById('team2');
    
    teams.forEach(team => {
        const opt1 = document.createElement('option');
        opt1.value = team;
        opt1.textContent = team;
        select1.appendChild(opt1);
        
        const opt2 = document.createElement('option');
        opt2.value = team;
        opt2.textContent = team;
        select2.appendChild(opt2);
    });
};

async function updateTeams(year, selectId) {
    if (!year || year < 1930) return;
    
    const response = await fetch(`/api/wc_teams?year=${year}`);
    const teams = await response.json();
    
    const select = document.getElementById(selectId);
    select.innerHTML = '<option value="">Select Team</option>';
    
    if (teams.length === 0) {
        select.innerHTML = '<option value="">No World Cup that year</option>';
        return;
    }
    
    teams.forEach(team => {
        const opt = document.createElement('option');
        opt.value = team;
        opt.textContent = team;
        select.appendChild(opt);
    });
}
  </script>
</body>
</html>
